[workspace]
resolver = "2"
members = ["suisei-core", "suisei-engine", "suisei-daemon"]

# Single source of truth for the app version. The packaging script reads this
# (`grep -m1 '^version' Cargo.toml`) into Info.plist. Suisei starts its own
# version line as an independent product.
[workspace.package]
version = "0.1.2"
edition = "2024"
# Custom source-available licence: closed source + 1-year-delayed public
# release. Only the delayed snapshot (e.g. `2026dev`) is forkable, private-use
# only. See LICENSE and docs/SUISEI-LICENSE-POLICY.md before changing this.
license = "LicenseRef-Suisei"
repository = "https://github.com/stremtec/suisei"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
