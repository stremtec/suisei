[package]
name = "suisei-engine"
version.workspace = true
edition.workspace = true
description = "Suisei desktop engine — Core host, Compositor, Bridge (Rust). Face is Swift."
license.workspace = true
publish = false

[lib]
name = "suisei_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
suisei-core = { path = "../suisei-core" }
# Wire protocol only (Status layout + socket path) so the engine can report its
# live LSP/DAP/project state to the daemon. The daemon crate is std-only, so
# this adds no third-party dependency, and the direction is one-way: the daemon
# never depends on the engine.
suisei-daemon = { path = "../suisei-daemon" }
unicode-width = "0.2"

[dev-dependencies]
# `typing_latency` measures THREAD CPU TIME rather than wall clock; see the
# note there. Test-only, so nothing ships with it.
libc = "0.2"
